<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SpineUp · 协议与声明中心</title>
  <style>
    :root {
      --bg-primary: #f5f5f7;
      --bg-card: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --text-muted: #a1a1a6;
      --border-color: rgba(0, 0, 0, 0.08);
      --accent-blue: #0071e3;
      --accent-red: #ff3b30;
      --accent-indigo: #5856d6;
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #000000;
        --bg-card: #1c1c1e;
        --text-primary: #f5f5f7;
        --text-secondary: #98989d;
        --text-muted: #636366;
        --border-color: rgba(255, 255, 255, 0.12);
        --accent-blue: #2997ff;
        --accent-red: #ff453a;
        --accent-indigo: #5e5ce6;
        --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--bg-primary);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
      border-bottom: 0.5px solid var(--border-color);
      padding: 14px 20px;
      text-align: center;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: -0.2px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 30px 18px;
    }

    .hub-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-icon {
      font-size: 52px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .hub-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .hub-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .link-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border-radius: 18px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--card-shadow);
      border: 0.5px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .link-card:active {
      transform: scale(0.985);
      opacity: 0.85;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-right: 16px;
      flex-shrink: 0;
    }

    .icon-box.medical {
      background: rgba(255, 59, 48, 0.1);
    }

    .icon-box.privacy {
      background: rgba(0, 113, 227, 0.1);
    }

    .icon-box.terms {
      background: rgba(88, 86, 214, 0.1);
    }

    .card-info {
      flex: 1;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 3px;
      color: var(--text-primary);
    }

    .card-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .chevron {
      color: var(--text-muted);
      font-size: 18px;
      margin-left: 10px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">SpineUp · 协议与声明中心</div>
  </header>

  <div class="container">

    <div class="hub-header">
      <div class="app-icon">🧘</div>
      <h1 class="hub-title">法律合规与服务协议</h1>
      <p class="hub-subtitle">SpineUp 重视您的身体健康与数据隐私安全</p>
    </div>

    <div class="link-list">
      <a href="medical.html" class="link-card">
        <div class="icon-box medical">🏥</div>
        <div class="card-info">
          <div class="card-title">健康与医疗免责声明</div>
          <div class="card-desc">非医疗器械声明、生物力学模型性质与专业就医指引</div>
        </div>
        <div class="chevron">›</div>
      </a>

      <a href="privacy.html" class="link-card">
        <div class="icon-box privacy">🛡️</div>
        <div class="card-info">
          <div class="card-title">隐私政策</div>
          <div class="card-desc">100% 传感器端侧本地计算、零云端上传与权限调用清单</div>
        </div>
        <div class="chevron">›</div>
      </a>

      <a href="terms.html" class="link-card">
        <div class="icon-box terms">📄</div>
        <div class="card-info">
          <div class="card-title">用户服务条款</div>
          <div class="card-desc">软件使用许可协议、免责条款与知识产权规范</div>
        </div>
        <div class="chevron">›</div>
      </a>
    </div>

    <footer>
      <p>© 2026 SpineUp · Protected by AirPods Spatial Motion & AI.</p>
      <p>All Rights Reserved.</p>
    </footer>

  </div>

</body>
</html>
